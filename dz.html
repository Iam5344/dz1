<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        let start = parseInt(prompt("Введіть початок діапазону:"));
        let end = parseInt(prompt("Введіть кінець діапазону:"));
        let sum = 0;
        for (let i = start; i <= end; i++) {
            sum += i;
        }
        alert(`Сума чисел у діапазоні: ${sum}`);

        let a = parseInt(prompt("НСД. Введіть перше число:"));
        let b = parseInt(prompt("Введіть друге число:"));
        while (b !== 0) {
            let temp = b;
            b = a % b;
            a = temp;
        }
        alert(`Найбільший спільний дільник: ${a}`);

        let num = parseInt(prompt("Введіть число для пошуку дільників:"));
        let divisors = [];
        for (let i = 1; i <= num; i++) {
            if (num % i === 0) divisors.push(i);
        }
        alert(`Дільники числа: ${divisors.join(', ')}`);

        let number = Math.abs(parseInt(prompt("Введіть число для підрахунку цифр:")));
        let count = 0;
        if (number === 0) {
            count = 1;
        } else {
            while (number > 0) {
                count++;
                number = Math.floor(number / 10);
            }
        }
        alert(`Kількість цифр у числі: ${count}`);

        let positive = 0, negative = 0, zeros = 0, even = 0, odd = 0;
        for (let i = 1; i <= 10; i++) {
            let userNum = parseInt(prompt(`Введіть число (${i} із 10):`));
            if (userNum > 0) positive++;
            else if (userNum < 0) negative++;
            else zeros++;
            
            if (userNum % 2 === 0) even++;
            else odd++;
        }
        alert(`Додатних: ${positive}\nВід'ємних: ${negative}\nНулів: ${zeros}\nПарних: ${even}\nНепарних: ${odd}`);

        let calcAgain;
        do {
            let n1 = parseFloat(prompt("Калькулятор. Перше число:"));
            let sign = prompt("Знак (+, -, *, /):");
            let n2 = parseFloat(prompt("Друге число:"));
            let res;
            if (sign === '+') res = n1 + n2;
            else if (sign === '-') res = n1 - n2;
            else if (sign === '*') res = n1 * n2;
            else if (sign === '/') res = n1 / n2;
            else res = "Помилка";
            alert(`Результат: ${res}`);
            calcAgain = confirm("Бажаєте розв'язати ще один приклад?");
        } while (calcAgain);

        let numStr = prompt("Введіть число для зміщення:");
        let shift = parseInt(prompt("На скільки цифр змістити?")) % numStr.length;
        for (let i = 0; i < shift; i++) {
            numStr = numStr.slice(1) + numStr[0];
        }
        alert(`Результат зміщення: ${numStr}`);

        const days = ["Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця", "Субота", "Неділя"];
        let index = 0;
        let nextDay;
        do {
            nextDay = confirm(`${days[index]}. Бажаєте побачити назву наступного дня тижня?`);
            index = (index + 1) % 7; 
        } while (nextDay);

        let tableResult = "";
        for (let i = 2; i <= 9; i++) {
            tableResult += `--- Таблиця на ${i} ---\n`;
            for (let j = 1; j <= 10; j++) {
                tableResult += `${i} x ${j} = ${i * j}\n`;
            }
            tableResult += "\n";
        }
        console.log(tableResult);
        alert("Таблицю множення виведено в консоль (F12 -> Console)");
    </script>
</body>
</html>
