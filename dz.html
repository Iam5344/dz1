<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Завдання JavaScript</title>
</head>
<body>
  <h1>Відкрийте консоль розробника (F12 -> Console)</h1>

  <script>

    function processArray(array, callback) {
      const result = [];
      for (let i = 0; i < array.length; i++) {
        result.push(callback(array[i]));
      }
      return result;
    }

    function doubleElement(element) {
      return element * 2;
    }

    function reverseElement(element) {
      return String(element).split('').reverse().join('');
    }

    console.log("--- Завдання 1 ---");
    console.log(processArray([1, 2, 3, 4, 5], doubleElement));
    console.log(processArray(["hello", "world"], reverseElement));



    function filterArray(array, callback) {
      const result = [];
      for (let i = 0; i < array.length; i++) {
        if (callback(array[i])) {
          result.push(array[i]);
        }
      }
      return result;
    }

    function isEven(number) {
      return number % 2 === 0;
    }

    function isShortWord(word) {
      return word.length <= 4;
    }

    console.log("\n--- Завдання 2 ---");
    console.log(filterArray([1, 2, 3, 4, 5, 6], isEven));
    console.log(filterArray(["apple", "cat", "banana", "dog", "js"], isShortWord));


    function washDishes() {
      return new Promise((resolve) => {
        setTimeout(() => {
          resolve("Посуд вимито");
        }, 2000);
      });
    }

    function cleanRoom() {
      return new Promise((resolve) => {
        setTimeout(() => {
          resolve("Кімнату прибрано");
        }, 4000);
      });
    }

    function makeDinner() {
      return new Promise((resolve) => {
        setTimeout(() => {
          resolve("Вечеря приготована");
        }, 7000);
      });
    }

    console.log("\n--- Завдання 3 (чекайте виконання Promises) ---");
    washDishes()
      .then((result) => {
        console.log(result);
        return cleanRoom();
      })
      .then((result) => {
        console.log(result);
        return makeDinner();
      })
      .then((result) => {
        console.log(result);
      });
  </script>
</body>
</html>
