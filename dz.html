<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fdfbf7;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        h2 {
            border-bottom: 2px solid #ddd;
            padding-bottom: 8px;
            color: #444;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-inline {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-inline .field {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .checkbox-group, .radio-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            padding-top: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #e0e0e0;
            border: 1px solid #bbb;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #d5d5d5;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ccc;
        }
        td {
            padding: 10px;
        }
        td:first-child {
            width: 30%;
            font-weight: bold;
            background-color: #f9f9f9;
        }
        .palette {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        .color-box {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #ccc;
            padding: 8px;
            background: #fff;
            border-radius: 4px;
            min-width: 180px;
        }
        .color-preview {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .color-text {
            font-size: 13px;
        }
        .color-inputs {
            display: flex;
            gap: 5px;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }
        .color-inputs input {
            width: 50px;
            text-align: center;
            padding: 4px;
        }
        .quiz-list {
            margin-bottom: 20px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
        }
        .quiz-item {
            margin-bottom: 15px;
            padding: 10px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .quiz-item .q-title {
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Завдання 3</h2>
        <form id="userForm">
            <div class="form-inline">
                <div class="field">
                    <label>Firstname:</label>
                    <input type="text" id="fname" required>
                </div>
                <div class="field">
                    <label>Lastname:</label>
                    <input type="text" id="lname" required>
                </div>
            </div>
            <div class="form-inline">
                <div class="field">
                    <label>Birthday:</label>
                    <input type="date" id="birthday" required>
                </div>
                <div class="field">
                    <label>Gender:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="Male" checked> Male</label>
                        <label><input type="radio" name="gender" value="Female"> Female</label>
                    </div>
                </div>
            </div>
            <div class="form-inline">
                <div class="field">
                    <label>Country:</label>
                    <select id="country">
                        <option value="Ukraine">Ukraine</option>
                        <option value="Canada">Canada</option>
                        <option value="USA">USA</option>
                    </select>
                </div>
                <div class="field">
                    <label>City:</label>
                    <select id="city">
                        <option value="Kyiv">Kyiv</option>
                        <option value="Toronto">Toronto</option>
                        <option value="New York">New York</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Skills:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="skills" value="HTML"> HTML</label>
                    <label><input type="checkbox" name="skills" value="CSS"> CSS</label>
                    <label><input type="checkbox" name="skills" value="JS"> JS</label>
                    <label><input type="checkbox" name="skills" value="PHP"> PHP</label>
                    <label><input type="checkbox" name="skills" value="C++"> C++</label>
                    <label><input type="checkbox" name="skills" value="JAVA"> JAVA</label>
                    <label><input type="checkbox" name="skills" value="C#"> C#</label>
                </div>
            </div>
            <button type="submit">Save</button>
        </form>

        <div id="resultTableContainer"></div>
    </div>

    <div class="container">
        <h2>Завдання 4</h2>
        <div style="text-align: center; max-width: 300px; margin: 0 auto;">
            <div class="color-inputs">
                <label>R</label><input type="text" id="colorR">
                <label>G</label><input type="text" id="colorG">
                <label>B</label><input type="text" id="colorB">
            </div>
            <button id="addColorBtn">Add color</button>
        </div>
        <div class="palette" id="paletteContainer"></div>
    </div>

    <div class="container">
        <h2>Завдання 5</h2>
        <div class="quiz-list">
            <h3>All questions:</h3>
            <div id="questionsContainer"></div>
        </div>
        <div>
            <h3>Add new question:</h3>
            <div class="form-group">
                <label>Question:</label>
                <input type="text" id="quizQuestion">
            </div>
            <div class="form-group">
                <label>Correct answer:</label>
                <input type="text" id="quizCorrect">
            </div>
            <div class="form-group">
                <label>Wrong answer:</label>
                <input type="text" id="quizWrong">
            </div>
            <button id="addQuestionBtn">Add</button>
        </div>
    </div>

    <script>
        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const fname = document.getElementById('fname').value;
            const lname = document.getElementById('lname').value;
            const birthday = document.getElementById('birthday').value;
            const gender = document.querySelector('input[name="gender"]:checked').value;
            const country = document.getElementById('country').value;
            const city = document.getElementById('city').value;
            
            const skills = [];
            document.querySelectorAll('input[name="skills"]:checked').forEach(cb => {
                skills.push(cb.value);
            });

            let formattedDate = birthday;
            if (birthday) {
                const parts = birthday.split('-');
                if (parts.length === 3) {
                    formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
                }
            }

            const container = document.getElementById('resultTableContainer');
            container.innerHTML = `
                <h3>Result:</h3>
                <table>
                    <tr><td>Firstname</td><td>${fname}</td></tr>
                    <tr><td>Lastname</td><td>${lname}</td></tr>
                    <tr><td>Birthday</td><td>${formattedDate}</td></tr>
                    <tr><td>Gender</td><td>${gender}</td></tr>
                    <tr><td>Country</td><td>${country}</td></tr>
                    <tr><td>City</td><td>${city}</td></tr>
                    <tr><td>Skills</td><td>${skills.join(', ')}</td></tr>
                </table>
            `;
        });

        const initialColors = [
            [165, 42, 42], [138, 43, 226], [0, 139, 139],
            [100, 149, 237], [210, 105, 30], [0, 206, 209],
            [189, 183, 107], [255, 105, 180]
        ];

        const paletteContainer = document.getElementById('paletteContainer');

        function renderColor(r, g, b) {
            const box = document.createElement('div');
            box.className = 'color-box';
            
            const preview = document.createElement('div');
            preview.className = 'color-preview';
            preview.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
            
            const text = document.createElement('div');
            text.className = 'color-text';
            text.textContent = `RGB (${r}, ${g}, ${b})`;
            
            box.appendChild(preview);
            box.appendChild(text);
            paletteContainer.appendChild(box);
        }

        initialColors.forEach(c => renderColor(c[0], c[1], c[2]));

        document.getElementById('addColorBtn').addEventListener('click', function() {
            const r = parseInt(document.getElementById('colorR').value) || 0;
            const g = parseInt(document.getElementById('colorG').value) || 0;
            const b = parseInt(document.getElementById('colorB').value) || 0;
            
            renderColor(Math.min(255, Math.max(0, r)), Math.min(255, Math.max(0, g)), Math.min(255, Math.max(0, b)));
            
            document.getElementById('colorR').value = '';
            document.getElementById('colorG').value = '';
            document.getElementById('colorB').value = '';
        });

        document.getElementById('addQuestionBtn').addEventListener('click', function() {
            const q = document.getElementById('quizQuestion').value;
            const c = document.getElementById('quizCorrect').value;
            const w = document.getElementById('quizWrong').value;

            if(!q || !c || !w) return;

            const qContainer = document.getElementById('questionsContainer');
            const item = document.createElement('div');
            item.className = 'quiz-item';
            
            item.innerHTML = `
                <div class="q-title">${q}</div>
                <div>Correct answer: ${c}</div>
                <div>Wrong answer: ${w}</div>
            `;
            
            qContainer.appendChild(item);

            document.getElementById('quizQuestion').value = '';
            document.getElementById('quizCorrect').value = '';
            document.getElementById('quizWrong').value = '';
        });
    </script>
</body>
</html>
