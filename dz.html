<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
class Marker {
    constructor(color, inkPercentage) {
        this.color = color;
        this.inkPercentage = inkPercentage;
    }

    print(text) {
        let printedText = "";
        for (let char of text) {
            if (char !== " ") {
                if (this.inkPercentage >= 0.5) {
                    printedText += char;
                    this.inkPercentage -= 0.5;
                } else {
                    break;
                }
            } else {
                printedText += char;
            }
        }
        document.write(`<p style="color: ${this.color};">${printedText}</p>`);
    }
}

class RefillableMarker extends Marker {
    refill() {
        this.inkPercentage = 100;
    }
}

const simpleMarker = new Marker("blue", 2);
simpleMarker.print("Hello World! This text is too long for this marker.");

const smartMarker = new RefillableMarker("red", 1);
smartMarker.print("Short text");
smartMarker.refill();
smartMarker.print("This text is printed after refilling the marker completely.");


class ExtendedDate extends Date {
    constructor(...args) {
        super(...args);
    }

    getTextMonth() {
        const months = [
            "січня", "лютого", "березня", "квітня", "травня", "червня",
            "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"
        ];
        return `${this.getDate()} ${months[this.getMonth()]}`;
    }

    isFutureOrPresent() {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const compareDate = new Date(this.getTime());
        compareDate.setHours(0, 0, 0, 0);
        return compareDate >= today;
    }

    isLeapYear() {
        const year = this.getFullYear();
        return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
    }

    getNextDate() {
        const next = new ExtendedDate(this.getTime());
        next.setDate(this.getDate() + 1);
        return next;
    }
}

const extDate = new ExtendedDate("2026-06-25");
document.write(`<p>Дата текстом: ${extDate.getTextMonth()}</p>`);
document.write(`<p>Майбутня або поточна: ${extDate.isFutureOrPresent()}</p>`);
document.write(`<p>Високосний рік: ${extDate.isLeapYear()}</p>`);
document.write(`<p>Наступна дата: ${extDate.getNextDate().toLocaleDateString()}</p>`);


class Employee {
    constructor(name, position, department, salary) {
        this.name = name;
        this.position = position;
        this.department = department;
        this.salary = salary;
    }
}

class EmpTable {
    constructor(employees) {
        this.employees = employees;
    }

    getHtml() {
        let html = '<table border="1" cellpadding="5" cellspacing="0">';
        html += '<thead><tr><th>Ім\'я</th><th>Посада</th><th>Відділ</th><th>Зарплата</th></tr></thead>';
        html += '<tbody>';
        
        for (let emp of this.employees) {
            html += `<tr>
                <td>${emp.name}</td>
                <td>${emp.position}</td>
                <td>${emp.department}</td>
                <td>${emp.salary}</td>
            </tr>`;
        }
        
        html += '</tbody></table>';
        return html;
    }
}

const bankEmployees = [
    new Employee("Олександр", "Менеджер", "Кредитний", 25000),
    new Employee("Марія", "Касир", "Касовий", 18000),
    new Employee("Дмитро", "Аналітик", "Фінансовий", 35000)
];

const empTable = new EmpTable(bankEmployees);
document.write(empTable.getHtml());
    </script>
</body>
</html>
